server:
  host: 127.0.0.1
  port: 8010
  path: /mcp

embedding:
  # `mock` keeps the sample system offline. Change to `huggingface` for a real model.
  provider: mock
  model: BAAI/bge-m3
  dimension: 384

retrieval:
  router:
    enabled: true
  vector:
    enabled: true
    top_k: 30
  bm25:
    enabled: true
    top_k: 30
  exact:
    enabled: true
    boost: 0.25
  fusion:
    strategy: rrf
    k: 60
    top_k: 30
  rerank:
    enabled: false
    top_k: 8
  hierarchy:
    enabled: true
    chunk_sizes: [2048, 512, 256]
