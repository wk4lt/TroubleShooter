[project]
name = "troubleshooter-knowledge-mcp"
version = "0.1.0"
description = "Independent LlamaIndex-backed Knowledge MCP server for TroubleShooter"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.12,<2",
  "llama-index-core>=0.12,<0.14",
  "llama-index-retrievers-bm25>=0.5,<0.7",
  "llama-index-embeddings-huggingface>=0.5,<0.7",
  "pyyaml>=6.0,<7",
]

[project.scripts]
knowledge-mcp = "app.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
